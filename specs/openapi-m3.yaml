openapi: 3.1.0
info:
  title: Sazeh M3 procurement and project-site inventory API
  version: 0.1.0
  description: >-
    Account-scoped draft synchronization, online posting, corrections, and finalized-record
    reporting. Quantities are decimal strings with at most three fractional digits; money is
    whole toman represented as a string.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /procurement/sync/commands:
    post:
      summary: Synchronize immutable material and procurement draft commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/SyncCommand"
      responses:
        "201":
          description: Per-command acknowledgements or conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchResult"
  /procurement/materials:
    get:
      summary: List shared materials
      parameters:
        - in: query
          name: archived
          schema: { type: boolean }
      responses:
        "200":
          description: Material directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Material" }
  /procurement/drafts/{id}/finalize:
    post:
      summary: Finalize one server draft transactionally
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeCommand"
      responses:
        "201": { description: Finalized document; receive-all also returns its linked receipt }
        "409": { $ref: "#/components/responses/Conflict" }
  /procurement/records/{id}/reverse:
    post:
      summary: Reverse a finalized invoice or payment with a reason
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FinalizeCommand"
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201": { description: Original and linked reversal records }
        "409": { $ref: "#/components/responses/Conflict" }
  /procurement/report:
    get:
      summary: Read finalized procurement, supplier, stock, and consumption analytics
      parameters:
        - { in: query, name: projectId, schema: { type: string, format: uuid } }
        - { in: query, name: supplierId, schema: { type: string, format: uuid } }
        - { in: query, name: materialId, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        "200":
          description: Finalized totals, pending count, stock, chart series, and source IDs
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    RecordId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Conflict:
      description: Stale version, dependency, duplicate-body, or stock conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Quantity:
      type: string
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]{1,3})?$"
      examples: ["12.500"]
    Toman:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      examples: ["250000"]
    MaterialInput:
      type: object
      additionalProperties: false
      required: [name, baseUnit]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        baseUnit: { type: string, minLength: 1, maxLength: 40 }
    Material:
      allOf:
        - $ref: "#/components/schemas/MaterialInput"
        - type: object
          required: [id, archived, version]
          properties:
            id: { type: string, format: uuid }
            archived: { type: boolean }
            archiveReason: { type: [string, "null"] }
            version: { type: integer, minimum: 1 }
    BaseDocument:
      type: object
      required: [kind, projectId, businessDate, description]
      properties:
        kind:
          enum: [PURCHASE_INVOICE, SUPPLIER_PAYMENT, STOCK_RECEIPT, STOCK_ISSUE, STOCK_TRANSFER, STOCK_RETURN, SUPPLIER_RETURN]
        projectId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        description: { type: string, minLength: 1, maxLength: 1000 }
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [id, materialId, quantity, unitPriceToman]
      properties:
        id: { type: string, format: uuid }
        materialId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitPriceToman: { $ref: "#/components/schemas/Toman" }
    DocumentInput:
      description: >-
        Discriminated input. Invoice/payment/receipt/supplier-return include supplierId;
        invoice has priced material lines; payment has amount and optional invoice allocations;
        receipt references invoice lines; issue/transfer have material quantities; returns reference
        source lines. Transfer additionally requires a different destinationProjectId.
      allOf:
        - $ref: "#/components/schemas/BaseDocument"
    SyncCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required: [commandType, commandId, entityId, expectedVersion, dependencyIds, input]
          properties:
            commandType: { const: DOCUMENT_UPSERT }
            commandId: { type: string, format: uuid }
            entityId: { type: string, format: uuid }
            expectedVersion: { type: integer, minimum: 0 }
            dependencyIds:
              type: array
              items: { type: string, format: uuid }
            input: { $ref: "#/components/schemas/DocumentInput" }
        - type: object
          additionalProperties: false
          required: [commandType, commandId, entityId, expectedVersion, input]
          properties:
            commandType: { const: MATERIAL_UPSERT }
            commandId: { type: string, format: uuid }
            entityId: { type: string, format: uuid }
            expectedVersion: { type: integer, minimum: 0 }
            input: { $ref: "#/components/schemas/MaterialInput" }
        - type: object
          additionalProperties: false
          required: [commandType, commandId, entityId, expectedVersion, action, reason]
          properties:
            commandType: { const: MATERIAL_LIFECYCLE }
            commandId: { type: string, format: uuid }
            entityId: { type: string, format: uuid }
            expectedVersion: { type: integer, minimum: 1 }
            action: { enum: [ARCHIVE, REOPEN] }
            reason: { type: string, minLength: 1, maxLength: 1000 }
    FinalizeCommand:
      type: object
      additionalProperties: false
      required: [commandId, expectedVersion]
      properties:
        commandId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
    BatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [ok]
            properties:
              ok: { type: boolean }
              result: {}
              status: { type: integer }
              error: { $ref: "#/components/schemas/Problem" }
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        currentVersion: { type: integer }
        dependencies:
          type: array
          items: { type: string }
